# SPDX-License-Identifier: GPL-3.0-or-later
# What can be checked on a PC, at every push and pull request: the string tables, and the tests in
# tools/tests (docs/BUILDING.md, Tests on a PC). Only what they need is fetched (tools/deps.py fetch
# NAME...); the PS5 build itself is not run here.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 pkg-config libarchive-dev libzip-dev libzstd-dev libssl-dev libfmt-dev libvulkan-dev p7zip-full ffmpeg

      - name: Downloads kept between runs
        uses: actions/cache@v4
        with:
          path: ~/.cache/ps5cemu-deps
          key: deps-${{ hashFiles('tools/deps.json') }}

      - name: What the tests need
        run: python3 -B tools/deps.py fetch pacbrew pugixml dr_mp3 rapidjson prosperoedenx melonds

      - name: String tables
        run: python3 -B tools/lang.py check

      - name: System paths and legacy discovery
        run: bash tools/tests/test-paths.sh

      - name: Separate Eden program paths
        run: |
          bash tools/eden-patches.sh apply
          bash tools/tests/test-eden-paths.sh

      - name: Switch updates and DLC beside their games
        run: |
          bash tools/tests/test-eden-addons.sh
          bash tools/tests/test-switch-addons.sh

      - name: A folder for each system, and back
        run: bash tools/tests/test-reorganize.sh

      - name: Verified system migration
        run: python3 -B tools/tests/test-separate-systems.py

      - name: Saves in both data layouts
        run: bash tools/tests/test-saves-paths.sh

      - name: Performance regression tools
        run: |
          python3 -B tools/tests/test-performance.py
          python3 -B tools/tests/test-performance-suite.py

      - name: Keyboards
        run: bash tools/tests/test-keyboard.sh

      - name: Network shares
        run: bash tools/tests/test-netfs.sh

      - name: Games in archives
        run: bash tools/tests/test-archives.sh

      - name: Launcher music
        run: bash tools/tests/test-music.sh

      - name: Updates' files
        run: bash tools/tests/test-update.sh

      - name: Library catalogue
        run: bash tools/tests/test-catalog.sh

      - name: DS screens' places
        run: bash tools/tests/test-screens.sh

      - name: Backups
        run: bash tools/tests/test-saves.sh

      - name: Additional emulator integration
        run: bash tools/tests/test-retro.sh

      - name: Additional emulator frontend syntax
        run: |
          clang++-18 -std=c++20 -Wno-deprecated-declarations -DFMT_HEADER_ONLY -DPS5CEMU_VERSION='"dev"' \
            -I.deps/rapidjson/include -Iport -fsyntax-only port/frontend/settings.cpp port/app/catalog.cpp \
            port/frontend/shell/shell.cpp port/frontend/shell/pages.cpp port/frontend/shell/settings.cpp \
            port/frontend/shell/library.cpp port/frontend/shell/hub.cpp port/retro/library.cpp port/retro/launch.cpp

      - name: Switch standalone features
        run: |
          # the launcher's copies of Eden's readers are Eden's, patches/eden applied (port/eden/standalone)
          for f in mods cheats patch_library native_directory ryujinx_saves; do
            cmp port/eden/standalone/$f.h .deps/ProsperoEdenX/headless/$f.h
          done
          bash tools/tests/test-eden-extras.sh

      - name: Switch player management
        run: bash tools/tests/test-profile-management.sh

      - name: Switch save transfers
        run: bash tools/tests/test-save-transfer.sh

      - name: DS Slot-2 input files
        run: bash tools/tests/test-slot2.sh

      - name: DS recorded microphone input
        run: bash tools/tests/test-microphone.sh

      - name: Frame capture buffer
        run: bash tools/tests/test-frame-capture.sh

      - name: Switch settings integration syntax
        run: |
          clang++-18 -std=c++20 -Wno-deprecated-declarations -DFMT_HEADER_ONLY -DPS5CEMU_VERSION='"5.0.1"' \
            -Iport -fsyntax-only port/frontend/shell/settings.cpp port/frontend/shell/switch_extras.cpp

      - name: DS Slot-2 and capture integration syntax
        run: |
          clang++-18 -std=c++20 -Wno-deprecated-declarations -DFMT_HEADER_ONLY \
            -I.deps/melonDS/src -Iport -fsyntax-only port/melonds/core.cpp port/melonds/platform.cpp port/melonds/input.cpp

      - name: Remote touch screen
        run: |
          mkdir -p build/tests
          ln -sfn "$PWD"/.deps/pacbrew-*/opt/ps5-payload-sdk/target/user/homebrew/include/fmt build/tests/fmt
          c++ -std=c++20 -pthread -DFMT_HEADER_ONLY -Ibuild/tests -Iport/stream tools/tests/stream-host.cpp \
              port/stream/stream.cpp port/stream/websocket.cpp -lcrypto -o build/tests/stream-host
          python3 -B tools/tests/test-stream.py build/tests/stream-host
          python3 -B tools/tests/test-upload.py build/tests/stream-host
          node tools/tests/test-stream-browser.js
